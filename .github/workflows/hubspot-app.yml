name: Deploy HubSpot app

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "hubspot/**"
      - ".github/workflows/hubspot-app.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEFAULT_ACCOUNT_ID: "247681548"
      DEFAULT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
      DEFAULT_CLI_VERSION: "8.15.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload and deploy HubSpot app
        uses: HubSpot/hubspot-project-actions@v1.1.0
        with:
          project_dir: "./hubspot"
