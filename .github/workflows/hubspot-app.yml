name: Deploy HubSpot app

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "hubspot/**"
      - ".github/workflows/hubspot-app.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install HubSpot CLI
        run: npm install --global @hubspot/cli@8.15.0

      - name: Authenticate HubSpot CLI
        env:
          HUBSPOT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_PERSONAL_ACCESS_KEY }}
        run: |
          mkdir -p "$HOME/.hscli"
          hs account auth --account campaign-proof --personal-access-key "$HUBSPOT_PERSONAL_ACCESS_KEY"
          hs account use campaign-proof

      - name: Upload and deploy HubSpot app
        working-directory: hubspot
        run: hs project upload --account campaign-proof
